name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  IMAGE: ghcr.io/jordanatdown/media-organizer

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Immutable version tag only. No `latest`: the infrastructure never
          # uses floating tags, so publishing one is just a way to be wrong.
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prove the image can be pulled anonymously
        run: |
          # A GHCR package is born private even from a public repo. Pulling with
          # no credentials turns a visibility mistake into a red build here
          # instead of a silent 401 on the Pi.
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # From the version heading to the next heading or the link references
          # at the bottom of the file; `---` separators are dropped.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]"             { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found && /^---$/                      { next }
            found                                 { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
