# media-organizer — configuration d'exemple.
#
# Copiez ce fichier, adaptez les chemins, puis validez-le sans rien démarrer :
#     media-organizer --config config.toml validate-config
#
# Une clé inconnue est une ERREUR (le fichier est généré par Ansible : une faute de
# frappe doit échouer bruyamment, pas être ignorée à 3 h du matin).

# ── Boucle ────────────────────────────────────────────────────────────────────────
# Secondes entre deux scans. C'est du polling : NFS ne propage pas les événements inotify.
poll_interval_secs = 30

# Threads des phases parallèles (planification et préparation). L'essentiel du temps est
# de la latence NFS, pas du CPU : plus de threads que de cœurs est normal. 1 = séquentiel
# et déterministe, pratique pour déboguer.
workers = 8

# Ignore les fichiers modifiés depuis moins de N secondes (upload encore en cours).
# 0 désactive.
stability_secs = 10

# ── Les trois catégories de dossiers ──────────────────────────────────────────────
#   inputs     les dossiers SOURCES (synchronisation) — un volume par dossier
#   libraries  les dossiers qui ACCUEILLENT les librairies (destination finale)
#   work       la zone de travail du service (transit, journal) — interne
#
# Dans le compose, chaque input et chaque library est monté séparément :
#     - /mnt/nas/…/synchronisation:/inputs/jordan
#     - /mnt/nas/…/phototeque:/libraries/jordan
# et la config les relie par leur NOM (voir [[folders]]), sans réécrire de chemin.
# Un nom sans « / » est cherché sous ces racines ; un chemin absolu reste possible.
inputs_root = "/inputs"
libraries_root = "/libraries"

# Dossier des caches persistants. Surchargé par --state-dir / MO_STATE_DIR.
# À monter comme un volume distinct de la configuration (qui est en lecture seule).
# state_dir = "/var/lib/media-organizer"

# Zone de travail privée : transit des fichiers en cours de traitement et journal de
# reprise, un sous-dossier par [[folders]]. Par défaut <state_dir>/work : elle n'a PAS
# besoin d'être montée. Ne la montez à part que pour déboguer.
# work_dir = "/work"

# error | warn | info | debug | trace (défaut : "info").
# Priorité (la plus haute d'abord) : variable RUST_LOG → flag --log-level / -v (ou
# MO_LOG_LEVEL) → cette clé. Utilisez "debug" pour comprendre pourquoi un fichier est
# ignoré ou voir les détails de l'injection EXIF.
log_level = "info"

# ── Permissions ───────────────────────────────────────────────────────────────────
# POURQUOI : l'export NFS est en all_squash. Un fichier ou un dossier créé avec le umask
# du processus peut devenir illisible pour l'identité sous laquelle Nextcloud le sert,
# qui répond alors 403. Le mode s'applique au fichier ET à chaque dossier de la
# librairie, de sa racine jusqu'au parent du fichier.
#
# Ce sont des chaînes OCTALES : TOML n'a pas de littéral octal, donc `file_mode = 777`
# serait lu en décimal et signifierait tout autre chose (refusé à la validation).
# Omettre une clé = ne PAS appeler chmod du tout. Chaque dossier peut surcharger.
[permissions]
file_mode = "0666"
dir_mode = "0777"

# ── Traitement par lot ────────────────────────────────────────────────────────────
# Tout le travail (dates, EXIF, doublons) se fait dans la zone de travail privée ; la
# librairie n'est touchée qu'à la fin : chaque fichier y est copié sous un nom temporaire
# caché (.nom.mo-part, que les scanners de librairie comme Immich n'indexent pas) puis
# rendu visible d'un coup par un renommage atomique.
[staging]
# Borne la durée d'un lot sur un premier passage massif (0 = illimité).
# Le reste attend le scan suivant.
max_batch = 1000

# ── Doublons ──────────────────────────────────────────────────────────────────────
# Un doublon = même nom de destination ET contenu identique (empreinte BLAKE3).
# Par défaut jamais supprimé : un faux positif détruirait une photo de famille.
# Il reste dans `input`, est journalisé une fois et mémorisé (state_dir/duplicates.json).
# On ne hache que les fichiers dont la taille collisionne : dans le cas nominal, rien.
[dedup]
enabled = true
# Comparer aussi aux fichiers déjà rangés (sinon : seulement au sein du lot courant).
check_existing = true
# Supprimer la source d'un doublon (typiquement un client de synchronisation qui renvoie
# un fichier déjà rangé). Désactivé par défaut. La source n'est supprimée qu'après une
# relecture octet par octet, à cet instant, des deux fichiers (jamais sur la seule foi de
# l'empreinte mémorisée), et seulement si l'original est déjà dans la librairie : un
# doublon au sein du même lot attend le scan suivant. Au moindre doute (contenu différent,
# source modifiée, lien symbolique, même inode, erreur de lecture), rien n'est supprimé.
# Exige enabled = true et check_existing = true. Les doublons déjà mémorisés avant
# l'activation ne sont pas réexaminés : supprimer state_dir/duplicates.json une fois.
delete_source_duplicates = false

# ── Fichiers sans date ────────────────────────────────────────────────────────────
# Mémoire des fichiers qu'aucune source n'a pu dater. Avec use_mtime_fallback = true
# (défaut), presque plus rien n'y entre ; il sert surtout si on le passe à false.
[no_date_cache]
enabled = true
# Jours avant de réessayer un fichier mémorisé ; 0 = seulement si son mtime change.
ttl_days = 0

# ── Supervision ───────────────────────────────────────────────────────────────────
# GET /livez  → 200 tant que le processus répond.
# GET /healthz → JSON, 503 si plus aucun progrès (typiquement un montage NFS figé).
[health]
# "" désactive. Surchargé par --health-bind / MO_HEALTH_BIND.
bind = "0.0.0.0:8080"
# Après le démarrage, « aucun scan fini » reste `starting` pendant ce délai.
startup_grace_secs = 120
# `stale` après poll_interval_secs × stale_intervals sans progrès (plancher : 60 s).
stale_intervals = 3

# ── Annonce de fin de lot ─────────────────────────────────────────────────────────
# Nextcloud ne voit pas les écritures de media-organizer : il lui faut un
# `occ files:scan` pour les indexer. media-organizer ne le lance PAS (le conteneur n'a ni
# Docker ni occ, et reste indépendant de Nextcloud) : il ANNONCE la fin de chaque lot, et
# l'infrastructure réagit. Désactivé par défaut : sans clé, rien n'est écrit.
#
# Un événement est publié par dossier, après le commit, si au moins un fichier a été
# publié dans la librairie ou une source supprimée de l'input. Jamais en --dry-run, jamais
# pour un lot sans effet (doublons conservés, erreurs). Un échec de publication est un
# `warn` (et passe /healthz en `degraded`) : il ne fait jamais échouer le lot.
# Contrat complet : docs/DEPLOYMENT.md. Une valeur vide "" désactive la clé.
#
# UPLOADS PROGRESSIFS : les fichiers arrivent au fil de l'eau et sont rangés dès qu'ils sont
# stables, donc le lot d'un scan est rarement tout l'upload. Annoncer chaque scan ferait
# relancer un `files:scan` toutes les 30 s. L'annonce est donc RETENUE (et cumulée, y
# compris les dossiers touchés) jusqu'à ce que l'input soit resté calme `quiet_secs`, sans
# jamais dépasser `max_wait_secs`. Le rangement lui-même n'est jamais retardé.
[notify]
# Dossier qui reçoit <nom du dossier>.json, écrasé à chaque lot et écrit de façon atomique
# (un lecteur ne voit jamais un JSON tronqué). Chemin absolu, hors de tout input et de
# toute librairie ; créé au besoin. C'est le déclencheur DURABLE : un consommateur arrêté
# lit l'événement à son retour (ex. une unité systemd .path sur ce dossier). Sous le
# dossier d'état, il est déjà sur un volume persistant.
# dir = "/var/lib/media-organizer/events"

# En plus : POST du même JSON. http:// uniquement (l'image n'embarque pas de TLS), un seul
# essai, envoi synchrone borné à 5 s au total : le récepteur doit répondre
# 2xx tout de suite (voir docs/DEPLOYMENT.md, « Écrire un récepteur »). Un récepteur arrêté
# PERD l'événement (le fichier ci-dessus, lui, reste). Depuis le conteneur, l'hôte s'atteint avec `extra_hosts:
# ["host.docker.internal:host-gateway"]`.
# webhook_url = "http://host.docker.internal:8123/batch"

# Annonce quand plus aucun fichier n'a été rangé depuis N secondes (le délai se compte
# depuis le DERNIER fichier). 0 = après chaque lot, sans attendre. Évalué à chaque scan :
# le délai réel est arrondi au `poll_interval_secs` supérieur.
# quiet_secs = 60

# Plafond : une annonce n'est jamais retenue plus longtemps que ça après le PREMIER fichier
# retenu, même si les uploads ne s'arrêtent pas (sinon un flux continu la repousserait
# indéfiniment). Doit être >= quiet_secs. Un flux continu produit donc au plus un événement
# par max_wait_secs.
# max_wait_secs = 600

# ── Dossiers ──────────────────────────────────────────────────────────────────────
# Un [[folders]] par paire source → librairie. `input` et `library` sont des NOMS
# (résolus sous inputs_root / libraries_root) ou des chemins absolus. La librairie ne
# doit pas être DANS un `input` récursif (le scan se nourrirait de sa propre sortie).
# Un `input` absent n'est pas fatal : NFS peut monter après le conteneur. Il est
# signalé `degraded` dans /healthz.
[[folders]]
# Libellé dans les logs et /healthz, et nom du sous-dossier de travail : doit être
# unique (défaut : le nom de l'input).
name = "jordan"
input = "jordan"          # → /inputs/jordan
library = "jordan"        # → /libraries/jordan

# Jetons du motif :
#   {year}    — année sur 4 chiffres (2024)
#   {month}   — mois sur 2 chiffres (01-12)
#   {day}     — jour sur 2 chiffres  (01-31)
#   {hour}    — heure sur 2 chiffres (00-23)
#   {min}     — minute sur 2 chiffres
#   {sec}     — seconde sur 2 chiffres
#   {stem}    — nom d'origine sans extension
#   {ext}     — extension avec le point (.jpg)
#   {camera}  — modèle d'appareil EXIF (assaini), « unknown » s'il est absent
#   {prefix}  — photo_prefix pour une photo, video_prefix pour une vidéo
# {counter} n'existe plus (il rendait toujours 0000) : utilisez on_conflict pour les
# collisions de nom. Un motif qui l'utilise est refusé à la validation.
pattern = "{year}/{month}/{year}-{month}-{day}_{hour}{min}{sec}_{stem}{ext}"

recursive = true
# Préfixes injectés via le jeton {prefix} (défaut : "")
# photo_prefix = "IMG_"
# video_prefix = "VID_"
photo_prefix = ""
video_prefix = ""

# Deux fichiers DIFFÉRENTS veulent le même nom (les contenus identiques sont des
# doublons, traités à part) : rename (_1, _2…) | skip | overwrite.
on_conflict = "rename"

# Minuscules, sans le point. Seules ces extensions sont traitées : ajoutez celles que vous
# voulez (heif, tif, 3gp…).
extensions = ["jpg", "jpeg", "png", "heic", "mp4", "mov", "avi", "mkv"]

# Sous-arbres élagués du parcours (jamais descendus), comparés à chaque composant du
# chemin. Les dossiers Synology restent : les données vivent toujours sur un volume DSM
# exporté en NFS, qui continue de générer une vignette @eaDir par photo.
#   @eaDir             — vignettes et métadonnées (Synology Photos / Photo Station)
#   @SynoEAStream      — flux d'attributs étendus (DSM)
#   @Recycle, #recycle — corbeille des dossiers partagés (selon la version de DSM)
#   #snapshot          — instantanés
#   @tmp               — fichiers temporaires DSM
# D'autres dossiers DSM peuvent s'ajouter selon votre installation :
#   @sharebin          — corbeille (anciennes versions de DSM)
#   @database, @photos — base interne et répertoire de travail de Synology Photos
#   @Recently-Snapshot — zone d'instantanés Btrfs (volumes Btrfs seulement)
# Redéfinir la clé REMPLACE la liste : reprenez les entrées par défaut que vous gardez.
excluded_dirs = [
    "@eaDir", "@SynoEAStream", "@Recycle", "#recycle", "#snapshot", "@tmp",
    ".stfolder", ".stversions", ".Trash", "$RECYCLE.BIN", "System Volume Information",
]

# Chaîne de date, dans cet ordre exact : EXIF → QuickTime (vidéos) → nom de fichier →
# date de dernière modification (mtime).
# Le mtime est un DERNIER RECOURS et une approximation : il est journalisé en `warn` et
# compté à part dans /healthz. false = comportement v1.2.4 (un fichier sans date n'est
# jamais déplacé).
use_mtime_fallback = true

# Écrire DateTimeOriginal dans le fichier quand la date vient du NOM (date explicite).
write_exif_from_filename = true
# Idem quand elle vient du MTIME. Désactivé : graver une approximation dans les
# métadonnées d'une photo est bien plus dur à défaire que de laisser le fichier sans tag.
write_exif_from_mtime = false

# Rendre {ext} en minuscules (.JPG → .jpg, .MOV → .mov) pour ne pas mélanger les casses
# dans une même librairie. Désactivé : cela change le nom de destination de tous les
# fichiers rangés ensuite (les fichiers déjà en place ne sont jamais renommés).
lowercase_ext = false

# Surcharges des [permissions] globales, pour ce dossier :
# file_mode = "0666"
# dir_mode = "0777"


# ── Autres dossiers (exemples) ────────────────────────────────────────────────────
# Autant de blocs [[folders]] que de sources. Un second utilisateur Nextcloud :
# [[folders]]
# name = "sylvie"
# input = "sylvie"
# library = "sylvie"
#
# Un boîtier photo en RAW, avec un motif et des préfixes à lui :
# [[folders]]
# name = "sony"
# input = "sony"
# library = "sony"
# pattern = "{year}/{month}/{prefix}_{year}_{month}_{day}-{hour}_{min}_{sec}{ext}"
# photo_prefix = "photo"
# video_prefix = "video"
# extensions = ["arw"]
